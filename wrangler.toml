# Configuração do Cloudflare Pages (site + painel de publicação)
name = "cbhto"
pages_build_output_dir = "."
compatibility_date = "2026-10-01"

# Banco de dados do painel (notícias, documentos, usuários, histórico)
[[d1_databases]]
binding = "DB"
database_name = "cbhto"
database_id = "b815a1ff-6004-4685-87c8-cec949cb0e57"

# Arquivos enviados pelo painel (PDFs e fotos, até 25 MB cada) – Workers KV
[[kv_namespaces]]
binding = "ARQUIVOS"
id = "0d6eb6dae2d04a3aba8dd3c7e7f658fb"

[vars]
# Administradores principais (separados por vírgula). Sempre têm acesso total.
ADMIN_EMAILS = "procomites@gmail.com"
# Preencher após configurar o Cloudflare Access (Zero Trust):
ACCESS_TEAM_DOMAIN = ""   # ex.: cbhto.cloudflareaccess.com
ACCESS_AUD = ""           # "Application Audience (AUD) Tag" da aplicação /admin
